# avdhcp ranges - one line per group. Edit per job, then run: avdhcp apply
#
#   group     start IP       end IP         vendors (keys from vendors.conf)
#
# - A group can hold several vendors (e.g. all the audio gear together).
# - "default" catches every device from a vendor not listed. Leave it out and
#   unknown devices get no address at all.
# - Ranges must be inside the router's LAN subnet and must not overlap.
# - DHCP reservations (static leases) set in the GL/LuCI UI still win.

leasetime 12h

crestron  172.22.0.100   172.22.0.150   crestron
audio     172.22.0.151   172.22.0.200   qsc biamp shure audinate
video     172.22.0.201   172.22.0.230   extron atlona justaddpower
default   172.22.0.231   172.22.0.250
